# Steward Alembic configuration.
#
# The database URL is determined at runtime by ``env.py`` using
# ``steward.infra.db.settings.inventory_db_path()``. The
# ``sqlalchemy.url`` entry here is a placeholder so ``alembic`` CLI
# invocations parse the file; runtime overrides it.

[alembic]
script_location = src/steward/infra/migrations
sqlalchemy.url = sqlite:///:memory:
prepend_sys_path = src
path_separator = os
version_path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
