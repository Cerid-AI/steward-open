[project]
name = "steward-fs"
version = "0.3.25"
description = "Steward — filesystem stewardship: scan, classify, plan, apply"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [
    { name = "sunrunner" },
]
readme = "README.md"

dependencies = [
    "typer>=0.15,<0.17",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "PyYAML>=6.0.2,<7",
    "structlog>=25.1,<26",
    "sentry-sdk>=2.18,<3",
    "alembic>=1.14,<2",
    "SQLAlchemy>=2.0.36,<3",
    "xxhash>=3.5,<4",
    "blake3>=1.0,<2",
    "sqlite-vec>=0.1.6,<0.2",
    "rich>=13.9,<14",
    "platformdirs>=4.3,<5",
    "watchdog>=4.0,<5",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.4",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "freezegun>=1.5,<2",
    "hypothesis>=6.115,<7",
    "bandit==1.9.4",
    "detect-secrets==1.5.0",
    "pip-audit==2.10.0",
    "pip-tools==7.5.3",
]

[project.scripts]
steward = "steward.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward"]

[tool.hatch.build.targets.wheel.force-include]
"src/steward/policies" = "steward/policies"

# ----------------------------------------------------------------------------
# ruff (matches Cerid 0.15.4 conventions)
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "BLE001"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["steward"]
known-third-party = ["mcp"]

[tool.ruff.lint.per-file-ignores]
"src/steward/cli/main.py" = ["E402", "BLE001"]
"**/tests/**" = ["BLE001"]

# ----------------------------------------------------------------------------
# mypy — strict mode for new code (stricter than Cerid)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/steward"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "blake3.*", "xxhash.*", "yaml", "yaml.*", "osxphotos.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Fast tests, no I/O",
    "integration: Multi-module, synthetic-FS or tiny-db",
    "preservation: Merge-gate invariants; never relax without ADR",
]

# ----------------------------------------------------------------------------
# import-linter — core/infra/cli boundary contracts
# ----------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["steward"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "core must not import infra or cli"
type = "forbidden"
source_modules = ["steward.core"]
forbidden_modules = ["steward.infra", "steward.cli"]

[[tool.importlinter.contracts]]
name = "cli must not import infra.db.connect directly"
type = "forbidden"
source_modules = ["steward.cli"]
forbidden_modules = ["steward.infra.db.connect"]
# Direct-only — the CLI calls the higher-level `infra.db.admin` facade,
# which then opens connections via `connect`. Transitive paths are fine.
allow_indirect_imports = true
